name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
      fail-fast: false

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Lint with flake8
      continue-on-error: true
      run: |
        # Stop on syntax errors or undefined names
        flake8 services/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
        # Full lint (allow to fail for now)
        flake8 services/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Format check with black
      continue-on-error: true
      run: |
        black --check services/ tests/ || echo "Formatting issues found (non-blocking)"

    - name: Run tests with pytest
      run: |
        # Run tests if they exist, otherwise pass
        pytest tests/ --cov=services --cov-report=xml --cov-report=term -v || echo "No tests yet or tests failed (non-blocking)"

    - name: Upload coverage
      continue-on-error: true
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build multiplexer
      run: docker compose build multiplexer

    - name: Build scanner
      run: docker compose build scanner

    - name: Build decoder
      run: docker compose build decoder

    - name: Test docker-compose config
      run: docker compose config
