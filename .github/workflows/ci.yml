name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/milesburton/nightwatch-dx

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run tests
      run: |
        pytest services/ -v --cov=services --cov-report=xml --cov-report=term-missing

    - name: Upload coverage
      continue-on-error: true
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  ui-test:
    name: UI build + type-check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "npm"
        cache-dependency-path: ui/package-lock.json

    - name: Install UI dependencies
      working-directory: ui
      run: npm ci

    - name: Type-check
      working-directory: ui
      run: npx tsc --noEmit

    - name: Unit tests
      working-directory: ui
      run: npx vitest run --config vitest.config.ts

    - name: Build
      working-directory: ui
      run: npm run build

  publish:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: [test, ui-test]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push rtl-bridge
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/rtl-bridge/Dockerfile
        push: true
        tags: |
          ${{ env.IMAGE_PREFIX }}/rtl-bridge:latest
          ${{ env.IMAGE_PREFIX }}/rtl-bridge:${{ github.sha }}
        cache-from: type=gha,scope=rtl-bridge
        cache-to: type=gha,mode=max,scope=rtl-bridge

    - name: Build and push cw-decoder
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/cw-decoder/Dockerfile
        push: true
        tags: |
          ${{ env.IMAGE_PREFIX }}/cw-decoder:latest
          ${{ env.IMAGE_PREFIX }}/cw-decoder:${{ github.sha }}
        cache-from: type=gha,scope=cw-decoder
        cache-to: type=gha,mode=max,scope=cw-decoder

    - name: Build and push sstv-decoder
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/sstv-decoder/Dockerfile
        push: true
        tags: |
          ${{ env.IMAGE_PREFIX }}/sstv-decoder:latest
          ${{ env.IMAGE_PREFIX }}/sstv-decoder:${{ github.sha }}
        cache-from: type=gha,scope=sstv-decoder
        cache-to: type=gha,mode=max,scope=sstv-decoder

    - name: Build and push easypal-decoder
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/easypal-decoder/Dockerfile
        push: true
        tags: |
          ${{ env.IMAGE_PREFIX }}/easypal-decoder:latest
          ${{ env.IMAGE_PREFIX }}/easypal-decoder:${{ github.sha }}
        cache-from: type=gha,scope=easypal-decoder
        cache-to: type=gha,mode=max,scope=easypal-decoder

    - name: Build and push psk31-decoder
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/psk31-decoder/Dockerfile
        push: true
        tags: |
          ${{ env.IMAGE_PREFIX }}/psk31-decoder:latest
          ${{ env.IMAGE_PREFIX }}/psk31-decoder:${{ github.sha }}
        cache-from: type=gha,scope=psk31-decoder
        cache-to: type=gha,mode=max,scope=psk31-decoder

    - name: Build and push api
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/api/Dockerfile
        push: true
        tags: |
          ${{ env.IMAGE_PREFIX }}/api:latest
          ${{ env.IMAGE_PREFIX }}/api:${{ github.sha }}
        cache-from: type=gha,scope=api
        cache-to: type=gha,mode=max,scope=api

    - name: Build and push ui
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/ui/Dockerfile
        push: true
        build-args: |
          APP_VERSION=${{ github.sha }}
        tags: |
          ${{ env.IMAGE_PREFIX }}/ui:latest
          ${{ env.IMAGE_PREFIX }}/ui:${{ github.sha }}
        cache-from: type=gha,scope=ui
        cache-to: type=gha,mode=max,scope=ui

  deploy:
    name: Deploy
    runs-on: self-hosted
    needs: publish
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: read

    steps:
    - uses: actions/checkout@v4

    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Pull images and restart services
      run: |
        docker compose pull
        docker compose up -d --remove-orphans
