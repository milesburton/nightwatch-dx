name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Python tests (rtl-bridge)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run tests
      run: |
        pytest services/ -v --cov=services --cov-report=xml --cov-report=term-missing

    - name: Upload coverage
      continue-on-error: true
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  ui-test:
    name: UI build + type-check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: "22"
        cache: "npm"
        cache-dependency-path: ui/package-lock.json

    - name: Install UI dependencies
      working-directory: ui
      run: npm ci

    - name: Type-check
      working-directory: ui
      run: npx tsc --noEmit

    - name: Unit tests
      working-directory: ui
      run: npx vitest run --config vitest.config.ts

    - name: Build
      working-directory: ui
      run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test, ui-test]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Validate docker-compose config
      run: docker compose config

    - name: Build rtl-bridge
      run: docker compose build rtl-bridge

    - name: Build cw-decoder
      run: docker compose build cw-decoder

    - name: Build sstv-decoder
      run: docker compose build sstv-decoder

    - name: Build easypal-decoder
      run: docker compose build easypal-decoder

    - name: Build ui
      run: docker compose build ui

  deploy:
    name: Deploy to home lab
    runs-on: self-hosted
    needs: docker
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Deploy services
      run: |
        APP_VERSION=$(git describe --tags --always)
        docker compose build --build-arg APP_VERSION=$APP_VERSION ui
        docker compose up -d --remove-orphans
