name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Run tests
      run: |
        pytest tests/ -v --cov=services --cov-report=xml --cov-report=term-missing

    - name: Upload coverage
      continue-on-error: true
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Validate docker-compose config
      run: docker compose config

    - name: Build rtl-bridge
      run: docker compose build rtl-bridge

    - name: Build cw-decoder
      run: docker compose build cw-decoder

    - name: Build sstv-decoder
      run: docker compose build sstv-decoder

    - name: Build spectrum
      run: docker compose build spectrum

    - name: Build ui
      run: docker compose build ui

  deploy:
    name: Deploy to home lab
    runs-on: self-hosted
    needs: docker
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Pull and restart services
      working-directory: /home/miles/gmktec-sdr-project
      run: |
        git pull
        docker compose up -d --build
