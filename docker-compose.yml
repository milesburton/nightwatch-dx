services:

  # ── RTL-SDR hardware interface + IQ multiplexer ───────────────────────────
  rtl-bridge:
    image: ghcr.io/milesburton/nightwatch-dx/rtl-bridge:latest
    build:
      context: .
      dockerfile: docker/rtl-bridge/Dockerfile
    container_name: nightwatch-dx-rtl-bridge
    restart: unless-stopped
    devices:
      - /dev/bus/usb:/dev/bus/usb
    privileged: true
    ports:
      - "1235:1235"   # TCP multiplexer (rtl_tcp-compatible)
      - "1236:1236"   # WebSocket IQ stream for browser
      - "1237:1237"   # Audio mux: CW (complex64 @ 24 kHz)
      - "1238:1238"   # Audio mux: SSTV (complex64 @ 24 kHz)
      - "1239:1239"   # Audio mux: EasyPal (complex64 @ 24 kHz)
      - "1240:1240"   # Audio mux: PSK31 (complex64 @ 24 kHz)
    environment:
      RTL_TCP_HOST: "127.0.0.1"
      RTL_TCP_PORT: "1234"
      MUX_PORT: "1235"
      WS_PORT: "1236"
      RTL_FREQUENCY: "${RTL_FREQUENCY:-139131000}"
      RTL_SAMPLE_RATE: "${RTL_SAMPLE_RATE:-1200000}"
      RTL_GAIN: "${RTL_GAIN:-77}"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',1235)); s.close()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── CW decoder ────────────────────────────────────────────────────────────
  cw-decoder:
    image: ghcr.io/milesburton/nightwatch-dx/cw-decoder:latest
    build:
      context: .
      dockerfile: docker/cw-decoder/Dockerfile
    container_name: nightwatch-dx-cw-decoder
    restart: unless-stopped
    depends_on:
      - rtl-bridge
    environment:
      MUX_HOST: "rtl-bridge"
      MUX_PORT: "1237"
      WS_PORT: "8765"
      DB_PATH: "${DB_PATH:-/data/nightwatch-dx.db}"
      FRAMES_DIR: "${FRAMES_DIR:-/data/frames}"
    volumes:
      - dx-data:/data
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8765)); s.close()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── SSTV decoder ──────────────────────────────────────────────────────────
  sstv-decoder:
    image: ghcr.io/milesburton/nightwatch-dx/sstv-decoder:latest
    build:
      context: .
      dockerfile: docker/sstv-decoder/Dockerfile
    container_name: nightwatch-dx-sstv-decoder
    restart: unless-stopped
    depends_on:
      - rtl-bridge
    environment:
      MUX_HOST: "rtl-bridge"
      MUX_PORT: "1238"
      WS_PORT: "8766"
      DB_PATH: "${DB_PATH:-/data/nightwatch-dx.db}"
      FRAMES_DIR: "${FRAMES_DIR:-/data/frames}"
    volumes:
      - dx-data:/data
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8766)); s.close()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── EasyPal decoder ───────────────────────────────────────────────────────
  easypal-decoder:
    image: ghcr.io/milesburton/nightwatch-dx/easypal-decoder:latest
    build:
      context: .
      dockerfile: docker/easypal-decoder/Dockerfile
    container_name: nightwatch-dx-easypal-decoder
    restart: unless-stopped
    depends_on:
      - rtl-bridge
    environment:
      MUX_HOST: "rtl-bridge"
      MUX_PORT: "1239"
      WS_PORT: "8767"
      DB_PATH: "${DB_PATH:-/data/nightwatch-dx.db}"
      FRAMES_DIR: "${FRAMES_DIR:-/data/frames}"
    volumes:
      - dx-data:/data
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8767)); s.close()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── PSK31 decoder ─────────────────────────────────────────────────────────
  psk31-decoder:
    image: ghcr.io/milesburton/nightwatch-dx/psk31-decoder:latest
    build:
      context: .
      dockerfile: docker/psk31-decoder/Dockerfile
    container_name: nightwatch-dx-psk31-decoder
    restart: unless-stopped
    depends_on:
      - rtl-bridge
    environment:
      MUX_HOST: "rtl-bridge"
      MUX_PORT: "1240"
      WS_PORT: "8768"
      DB_PATH: "${DB_PATH:-/data/nightwatch-dx.db}"
      FRAMES_DIR: "${FRAMES_DIR:-/data/frames}"
    volumes:
      - dx-data:/data
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; s=socket.socket(); s.settimeout(2); s.connect(('127.0.0.1',8768)); s.close()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── API service ───────────────────────────────────────────────────────────
  api:
    image: ghcr.io/milesburton/nightwatch-dx/api:latest
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: nightwatch-dx-api
    restart: unless-stopped
    depends_on:
      - cw-decoder
      - psk31-decoder
      - sstv-decoder
      - easypal-decoder
    environment:
      DB_PATH: "${DB_PATH:-/data/nightwatch-dx.db}"
      FRAMES_DIR: "${FRAMES_DIR:-/data/frames}"
      API_PORT: "${API_PORT:-8900}"
    volumes:
      - dx-data:/data
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8900/api/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Web UI ────────────────────────────────────────────────────────────────
  ui:
    image: ghcr.io/milesburton/nightwatch-dx/ui:latest
    build:
      context: .
      dockerfile: docker/ui/Dockerfile
    container_name: nightwatch-dx-ui
    restart: unless-stopped
    depends_on:
      - rtl-bridge
      - cw-decoder
      - sstv-decoder
      - easypal-decoder
      - psk31-decoder
      - api
    ports:
      - "${UI_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ > /dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dx-data:    # persistent storage shared by all decoders and the api service
