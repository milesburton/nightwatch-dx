services:

  # ── RTL-SDR hardware interface + IQ multiplexer ───────────────────────────
  rtl-bridge:
    build:
      context: .
      dockerfile: docker/rtl-bridge/Dockerfile
    container_name: dx-watch-rtl-bridge
    restart: unless-stopped
    devices:
      - /dev/bus/usb:/dev/bus/usb
    privileged: true
    ports:
      - "1235:1235"   # TCP multiplexer (rtl_tcp-compatible)
      - "1236:1236"   # WebSocket IQ stream for browser
    environment:
      RTL_TCP_HOST: "127.0.0.1"
      RTL_TCP_PORT: "1234"
      MUX_PORT: "1235"
      WS_PORT: "1236"

  # ── CW decoder ────────────────────────────────────────────────────────────
  cw-decoder:
    build:
      context: .
      dockerfile: docker/cw-decoder/Dockerfile
    container_name: dx-watch-cw-decoder
    restart: unless-stopped
    depends_on:
      - rtl-bridge
    environment:
      MUX_HOST: "rtl-bridge"
      MUX_PORT: "1235"
      WS_PORT: "8765"

  # ── SSTV decoder ──────────────────────────────────────────────────────────
  sstv-decoder:
    build:
      context: .
      dockerfile: docker/sstv-decoder/Dockerfile
    container_name: dx-watch-sstv-decoder
    restart: unless-stopped
    depends_on:
      - rtl-bridge
    environment:
      MUX_HOST: "rtl-bridge"
      MUX_PORT: "1235"
      WS_PORT: "8766"

  # ── EasyPal decoder ───────────────────────────────────────────────────────
  easypal-decoder:
    build:
      context: .
      dockerfile: docker/easypal-decoder/Dockerfile
    container_name: dx-watch-easypal-decoder
    restart: unless-stopped
    depends_on:
      - rtl-bridge
    environment:
      MUX_HOST: "rtl-bridge"
      MUX_PORT: "1235"
      WS_PORT: "8767"

  # ── Web UI ────────────────────────────────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: docker/ui/Dockerfile
    container_name: dx-watch-ui
    restart: unless-stopped
    depends_on:
      - rtl-bridge
      - cw-decoder
      - sstv-decoder
      - easypal-decoder
    ports:
      - "8080:80"
