services:

  # ── RTL-SDR hardware interface + IQ multiplexer ───────────────────────────
  rtl-bridge:
    build:
      context: .
      dockerfile: docker/rtl-bridge/Dockerfile
    container_name: sdr-rtl-bridge
    restart: unless-stopped
    devices:
      - /dev/bus/usb:/dev/bus/usb
    privileged: true
    ports:
      - "1235:1235"   # multiplexer port (external access if needed)
    environment:
      RTL_TCP_HOST: "127.0.0.1"
      RTL_TCP_PORT: "1234"
      MUX_PORT: "1235"

  # ── CW (Morse code) decoder ───────────────────────────────────────────────
  cw-decoder:
    build:
      context: .
      dockerfile: docker/cw-decoder/Dockerfile
    container_name: sdr-cw-decoder
    restart: unless-stopped
    depends_on:
      - rtl-bridge
    environment:
      RTL_HOST: "rtl-bridge"
      RTL_PORT: "1235"
      WS_PORT: "8765"
      CW_FREQ_HZ: "14065000"    # 14.065 MHz (measured peak from band scan)
      SDR_CENTER_HZ: "139175000" # rtl_tcp centre (RF + 125MHz LO)
      LO_OFFSET_HZ: "125000000"  # NooElec upconverter LO
      SAMPLE_RATE: "2400000"    # 2.4 Msps — mixed+decimated 100x to 24 kHz
      GAIN: "420"               # 42.0 dB (tenths of dB)
      WPM: "20"

  # ── SSTV decoder ──────────────────────────────────────────────────────────
  sstv-decoder:
    build:
      context: .
      dockerfile: docker/sstv-decoder/Dockerfile
    container_name: sdr-sstv-decoder
    restart: unless-stopped
    depends_on:
      - rtl-bridge
    environment:
      RTL_HOST: "rtl-bridge"
      RTL_PORT: "1235"
      WS_PORT: "8766"
      SSTV_FREQ_HZ: "14230000"  # 14.230 MHz SSTV calling frequency
      SAMPLE_RATE: "2400000"
      GAIN: "420"

  # ── Spectrum / waterfall ───────────────────────────────────────────────────
  spectrum:
    build:
      context: .
      dockerfile: docker/spectrum/Dockerfile
    container_name: sdr-spectrum
    restart: unless-stopped
    depends_on:
      - rtl-bridge
    environment:
      RTL_HOST: "rtl-bridge"
      RTL_PORT: "1235"
      WS_PORT: "8767"
      RF_CENTER_HZ: "14175000"  # 14.175 MHz — centre of 20m CW+SSTV segment
      SAMPLE_RATE: "2400000"

  # ── Web UI ────────────────────────────────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: docker/ui/Dockerfile
    container_name: sdr-ui
    restart: unless-stopped
    depends_on:
      - cw-decoder
      - sstv-decoder
      - spectrum
    ports:
      - "8080:80"
