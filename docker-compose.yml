services:

  # ── RTL-SDR hardware interface + IQ multiplexer ───────────────────────────
  rtl-bridge:
    build:
      context: .
      dockerfile: docker/rtl-bridge/Dockerfile
    container_name: sdr-rtl-bridge
    restart: unless-stopped
    devices:
      - /dev/bus/usb:/dev/bus/usb
    privileged: true
    ports:
      - "1235:1235"   # multiplexer port (external access if needed)
    environment:
      RTL_TCP_HOST: "127.0.0.1"
      RTL_TCP_PORT: "1234"
      MUX_PORT: "1235"

  # ── CW (Morse code) decoder ───────────────────────────────────────────────
  cw-decoder:
    build:
      context: .
      dockerfile: docker/cw-decoder/Dockerfile
    container_name: sdr-cw-decoder
    restart: unless-stopped
    depends_on:
      - rtl-bridge
    environment:
      RTL_HOST: "rtl-bridge"
      RTL_PORT: "1235"
      WS_PORT: "8765"
      CW_FREQ_HZ: "14000000"    # 14.000 MHz CW calling frequency
      LO_OFFSET_HZ: "125000000" # NooElec upconverter LO
      SAMPLE_RATE: "240000"
      GAIN: "250"
      WPM: "20"

  # ── SSTV decoder ──────────────────────────────────────────────────────────
  sstv-decoder:
    build:
      context: .
      dockerfile: docker/sstv-decoder/Dockerfile
    container_name: sdr-sstv-decoder
    restart: unless-stopped
    depends_on:
      - rtl-bridge
    environment:
      RTL_HOST: "rtl-bridge"
      RTL_PORT: "1235"
      WS_PORT: "8766"
      SSTV_FREQ_HZ: "14230000"  # 14.230 MHz SSTV calling frequency
      LO_OFFSET_HZ: "125000000"
      SDR_SAMPLE_RATE: "240000"
      GAIN: "250"

  # ── Web UI ────────────────────────────────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: docker/ui/Dockerfile
    container_name: sdr-ui
    restart: unless-stopped
    depends_on:
      - cw-decoder
      - sstv-decoder
    ports:
      - "8080:80"
