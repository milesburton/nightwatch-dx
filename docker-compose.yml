# Docker Compose for GMKtec SDR Project (Bare Metal)
services:
  # RTL-SDR I/Q Streaming Server
  rtl-tcp:
    image: debian:bookworm-slim
    container_name: sdr-rtl-tcp
    restart: unless-stopped
    devices:
      - /dev/bus/usb:/dev/bus/usb
    privileged: true
    network_mode: host
    command: >
      sh -c "apt-get update -qq && apt-get install -y -qq rtl-sdr &&
             rtl_biast -d 0 -b 1 &&
             rtl_tcp -a 0.0.0.0 -f 139150000 -s 2400000 -g 25"

  # I/Q Sample Multiplexer
  multiplexer:
    build:
      context: .
      dockerfile: docker/multiplexer/Dockerfile
    container_name: sdr-multiplexer
    restart: unless-stopped
    depends_on:
      - rtl-tcp
    network_mode: host
    environment:
      - RTL_TCP_HOST=127.0.0.1
      - RTL_TCP_PORT=1234
      - MUX_PORT=1235

  # Band Scanner
  scanner:
    build:
      context: .
      dockerfile: docker/scanner/Dockerfile
    container_name: sdr-scanner
    restart: unless-stopped
    depends_on:
      - multiplexer
    network_mode: host
    environment:
      - MUX_HOST=127.0.0.1
      - MUX_PORT=1235
      - LOCK_THRESHOLD=-6
      - STRONG_THRESHOLD=-4
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data

  # CW Decoder (on-demand)
  decoder:
    build:
      context: .
      dockerfile: docker/decoder/Dockerfile
    container_name: sdr-decoder
    restart: "no"
    depends_on:
      - multiplexer
    network_mode: host
    environment:
      - MUX_HOST=127.0.0.1
      - MUX_PORT=1235
    volumes:
      - ./logs:/app/logs
    stdin_open: true
    tty: true
