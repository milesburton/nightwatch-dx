services:

  # ── RTL-SDR hardware interface + IQ multiplexer ───────────────────────────
  rtl-bridge:
    image: ghcr.io/milesburton/dx-watch/rtl-bridge:latest
    build:
      context: .
      dockerfile: docker/rtl-bridge/Dockerfile
    container_name: dx-watch-rtl-bridge
    restart: unless-stopped
    devices:
      - /dev/bus/usb:/dev/bus/usb
    privileged: true
    ports:
      - "1235:1235"   # TCP multiplexer (rtl_tcp-compatible)
      - "1236:1236"   # WebSocket IQ stream for browser
      - "1237:1237"   # Audio mux: CW (complex64 @ 24 kHz)
      - "1238:1238"   # Audio mux: SSTV (complex64 @ 24 kHz)
      - "1239:1239"   # Audio mux: EasyPal (complex64 @ 24 kHz)
      - "1240:1240"   # Audio mux: PSK31 (complex64 @ 24 kHz)
    environment:
      RTL_TCP_HOST: "127.0.0.1"
      RTL_TCP_PORT: "1234"
      MUX_PORT: "1235"
      WS_PORT: "1236"

  # ── CW decoder ────────────────────────────────────────────────────────────
  cw-decoder:
    image: ghcr.io/milesburton/dx-watch/cw-decoder:latest
    build:
      context: .
      dockerfile: docker/cw-decoder/Dockerfile
    container_name: dx-watch-cw-decoder
    restart: unless-stopped
    depends_on:
      - rtl-bridge
    environment:
      MUX_HOST: "rtl-bridge"
      MUX_PORT: "1237"
      WS_PORT: "8765"
      DB_PATH: "/data/dx-watch.db"
      FRAMES_DIR: "/data/frames"
    volumes:
      - dx-data:/data

  # ── SSTV decoder ──────────────────────────────────────────────────────────
  sstv-decoder:
    image: ghcr.io/milesburton/dx-watch/sstv-decoder:latest
    build:
      context: .
      dockerfile: docker/sstv-decoder/Dockerfile
    container_name: dx-watch-sstv-decoder
    restart: unless-stopped
    depends_on:
      - rtl-bridge
    environment:
      MUX_HOST: "rtl-bridge"
      MUX_PORT: "1238"
      WS_PORT: "8766"
      DB_PATH: "/data/dx-watch.db"
      FRAMES_DIR: "/data/frames"
    volumes:
      - dx-data:/data

  # ── EasyPal decoder ───────────────────────────────────────────────────────
  easypal-decoder:
    image: ghcr.io/milesburton/dx-watch/easypal-decoder:latest
    build:
      context: .
      dockerfile: docker/easypal-decoder/Dockerfile
    container_name: dx-watch-easypal-decoder
    restart: unless-stopped
    depends_on:
      - rtl-bridge
    environment:
      MUX_HOST: "rtl-bridge"
      MUX_PORT: "1239"
      WS_PORT: "8767"
      DB_PATH: "/data/dx-watch.db"
      FRAMES_DIR: "/data/frames"
    volumes:
      - dx-data:/data

  # ── PSK31 decoder ─────────────────────────────────────────────────────────
  psk31-decoder:
    image: ghcr.io/milesburton/dx-watch/psk31-decoder:latest
    build:
      context: .
      dockerfile: docker/psk31-decoder/Dockerfile
    container_name: dx-watch-psk31-decoder
    restart: unless-stopped
    depends_on:
      - rtl-bridge
    environment:
      MUX_HOST: "rtl-bridge"
      MUX_PORT: "1240"
      WS_PORT: "8768"
      DB_PATH: "/data/dx-watch.db"
      FRAMES_DIR: "/data/frames"
    volumes:
      - dx-data:/data

  # ── API service ───────────────────────────────────────────────────────────
  api:
    image: ghcr.io/milesburton/dx-watch/api:latest
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: dx-watch-api
    restart: unless-stopped
    depends_on:
      - cw-decoder
      - psk31-decoder
      - sstv-decoder
      - easypal-decoder
    environment:
      DB_PATH: "/data/dx-watch.db"
      FRAMES_DIR: "/data/frames"
      API_PORT: "8900"
    volumes:
      - dx-data:/data

  # ── Web UI ────────────────────────────────────────────────────────────────
  ui:
    image: ghcr.io/milesburton/dx-watch/ui:latest
    build:
      context: .
      dockerfile: docker/ui/Dockerfile
    container_name: dx-watch-ui
    restart: unless-stopped
    depends_on:
      - rtl-bridge
      - cw-decoder
      - sstv-decoder
      - easypal-decoder
      - psk31-decoder
      - api
    ports:
      - "8080:80"

volumes:
  dx-data:    # persistent storage shared by all decoders and the api service
