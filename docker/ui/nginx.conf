server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # WebSocket proxy for CW decoder
    location /ws/cw {
        proxy_pass http://cw-decoder:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # WebSocket proxy for SSTV decoder
    location /ws/sstv {
        proxy_pass http://sstv-decoder:8766;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
