server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Never cache index.html or version.json — browsers must always revalidate
    location ~* ^/(index\.html|version\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri /index.html;
    }

    # Content-hashed assets can be cached indefinitely
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # WebSocket for browser log shipping → cw-decoder
    location /ws/logs {
        proxy_pass http://cw-decoder:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # WebSocket proxy for raw IQ stream (rtl-bridge)
    location /ws/iq {
        proxy_pass http://rtl-bridge:1236;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # WebSocket proxy for server status (CPU/RAM/disk)
    location /ws/status {
        proxy_pass http://cw-decoder:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # WebSocket proxy for CW decoder
    location /ws/cw {
        proxy_pass http://cw-decoder:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # WebSocket proxy for SSTV decoder
    location /ws/sstv {
        proxy_pass http://sstv-decoder:8766;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # WebSocket proxy for EasyPal decoder
    location /ws/easypal {
        proxy_pass http://easypal-decoder:8767;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # WebSocket proxy for PSK31 decoder
    location /ws/psk31 {
        proxy_pass http://psk31-decoder:8768;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
